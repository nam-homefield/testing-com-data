# Deploy the report site to GitHub Pages.
#
# This replaces GitHub's built-in branch-based "pages build and deployment". That
# builder has no concurrency control, and the publishers here push often: the orders
# report every 30 minutes, plus the std / blood / tests / treatments refreshes. Pages
# allows one in-progress deployment at a time, so when a deploy hung server-side on
# 2026-08-27 the next push was rejected outright:
#
#   Deployment request failed ... due to in progress deployment.
#   Please cancel 28d28df first or wait for it to complete.
#
# The concurrency block below is the fix. A newer push cancels the older run, and
# actions/deploy-pages cancels its own pending deployment when cancelled, which
# releases the lock instead of leaving it held until it times out. Superseding is the
# behaviour we want here anyway: these are dashboards, so only the latest build
# matters and an older one still in flight is already stale.
#
# The deploy step retries once on its own. Roughly 3 deploys in 100 failed with
# "Fetching artifact metadata failed ... No artifacts named "github-pages" were found
# for this workflow run" (example run 43378746073). This is most likely a race on GitHub's side:
# upload and deploy share one job, and deploy-pages lists the run's artifacts a
# fraction of a second after the upload finished, before the listing sees it. Upgrading
# does not fix it. The latest deploy-pages (v5.0.1) only added backoff to its status
# polling, and the matching upstream report, actions/deploy-pages#451, is still open.
# A re-run of the whole workflow is no good either (a second upload makes the lookup
# fail with "Multiple artifacts"), but a second deploy attempt in the same job is safe,
# because it only repeats the lookup and the artifact is already there.
#
# How the retry works: attempt 1 has continue-on-error, so a failure does not end the
# job. Attempt 2 runs after a 30 second wait only if attempt 1 failed, and it has no
# continue-on-error, so if it fails too the job fails and the failure email still goes
# out. A real, lasting failure is therefore never hidden. Neither retry step runs
# when the run is cancelled: a step with no status function in its condition gets an
# implicit success(), which is false once the run is cancelled, and attempt 1 reports
# "cancelled", not "failure". So the concurrency block above still ends a superseded
# run immediately instead of waiting out the 30 seconds and retrying.
#
# No Jekyll step on purpose. upload-pages-artifact serves the files exactly as pushed,
# which is what the reports need, and the repo has no Jekyll sources.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Attempt 1. A failure here is swallowed so that attempt 2 can run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Attempt 2, only if attempt 1 failed. This one is allowed to fail the job.
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
