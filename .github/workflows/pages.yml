# Deploy the report site to GitHub Pages.
#
# This replaces GitHub's built-in branch-based "pages build and deployment". That
# builder has no concurrency control, and the publishers here push often: the orders
# report every 30 minutes, plus the std / blood / tests / treatments refreshes. Pages
# allows one in-progress deployment at a time, so when a deploy hung server-side on
# 2026-08-27 the next push was rejected outright:
#
#   Deployment request failed ... due to in progress deployment.
#   Please cancel 28d28df first or wait for it to complete.
#
# The concurrency block below is the fix. A newer push cancels the older run, and
# actions/deploy-pages cancels its own pending deployment when cancelled, which
# releases the lock instead of leaving it held until it times out. Superseding is the
# behaviour we want here anyway: these are dashboards, so only the latest build
# matters and an older one still in flight is already stale.
#
# A wait-for-artifact step runs before the deploy. Roughly 3 deploys in 100 failed with
# "Fetching artifact metadata failed ... No artifacts named "github-pages" were found
# for this workflow run" (example run 43378746073). This is most likely a race on GitHub's side:
# upload and deploy share one job, and deploy-pages lists the run's artifacts a
# fraction of a second after the upload finished, before the listing sees it. Upgrading
# does not fix it. The latest deploy-pages (v5.0.1) only added backoff to its status
# polling, and the matching upstream report, actions/deploy-pages#451, is still open.
# Re-running the whole workflow is no good either (a second upload makes the lookup
# fail with "Multiple artifacts").
#
# The fix is narrow on purpose. After the upload, a step polls the run's artifact list
# (the REST API, every 3 seconds, up to about 60 seconds) until "github-pages" shows
# up, then deploy-pages runs exactly once. If the artifact never shows up, that step
# fails with a clear message. The deploy step has no continue-on-error and is never
# repeated, so any failure after a deployment exists (a stuck or rejected deployment,
# a timeout) still fails the run and sends the email, and a retry can never leave an
# "in progress deployment" lock behind. The wait step also respects the concurrency
# block above: a cancelled run stops the step, so a superseded run ends at once.
#
# No Jekyll step on purpose. upload-pages-artifact serves the files exactly as pushed,
# which is what the reports need, and the repo has no Jekyll sources.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read   # lets the wait step list this run's artifacts
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Wait until the artifact is listed, so deploy-pages does not look too early.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" -ge 1 ]; then
              echo "Artifact github-pages is listed (check $i)."
              sleep 5
              exit 0
            fi
            echo "Artifact github-pages not listed yet (check $i of 20)."
            sleep 3
          done
          echo "::error::Artifact github-pages was never listed for this run after about 60 seconds."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
