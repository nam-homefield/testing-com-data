# Deploy the report site to GitHub Pages.
#
# This replaces GitHub's built-in branch-based "pages build and deployment". That
# builder has no concurrency control, and the publishers here push often: the orders
# report every 30 minutes, plus the std / blood / tests / treatments refreshes. Pages
# allows one in-progress deployment at a time, so when a deploy hung server-side on
# 2026-08-27 the next push was rejected outright:
#
#   Deployment request failed ... due to in progress deployment.
#   Please cancel 28d28df first or wait for it to complete.
#
# The concurrency block below is the fix. A newer push cancels the older run, and
# actions/deploy-pages cancels its own pending deployment when cancelled, which
# releases the lock instead of leaving it held until it times out. Superseding is the
# behaviour we want here anyway: these are dashboards, so only the latest build
# matters and an older one still in flight is already stale.
#
# A wait-for-artifact step runs before the deploy. Roughly 3 deploys in 100 failed with
# "Fetching artifact metadata failed ... No artifacts named "github-pages" were found
# for this workflow run" (example run 43378746073). This is most likely a race on GitHub's side:
# upload and deploy share one job, and deploy-pages lists the run's artifacts a
# fraction of a second after the upload finished, before the listing sees it. Upgrading
# does not fix it. The latest deploy-pages (v5.0.1) only added backoff to its status
# polling, and the matching upstream report, actions/deploy-pages#451, is still open.
# Re-running the whole workflow is no good either (a second upload makes the lookup
# fail with "Multiple artifacts").
#
# The fix is narrow on purpose. After the upload, a step polls the same lookup that
# deploy-pages uses (the Actions results service, Twirp ListArtifacts, called the way
# actions/toolkit packages/artifact does it: backend IDs read from the runtime token,
# JSON body with the snake_case field names, bearer auth) every 3 seconds, up to about
# 60 seconds, until "github-pages" is listed. Then deploy-pages runs exactly once. If
# the artifact never shows up, the step fails with a clear message. The deploy step has
# no continue-on-error and is never repeated, so any failure after a deployment exists
# (a stuck or rejected deployment, a timeout) fails the deploy job, and a retry can never
# leave an "in progress deployment" lock behind. The wait step
# also respects the concurrency block above: a cancelled run stops the step, so a
# superseded run ends at once. The step is an actions/github-script node action, which
# is why it gets ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL from the runner.
#
# Emails (ticket 5, 2026-11-24). GitHub sends "Run failed: Deploy Pages - main" whenever a
# run ends as failed. Since Nov 21 about 14 of 387 deploys hit the artifact error above even
# with the wait step in place, and each was followed by a good deploy about 15 minutes
# later, so the email was noise. Now a lone failed deploy sends nothing, and two failed
# deploys in a row still send the email, as does every failed deploy after that until one
# works. Two jobs do it:
#
#   deploy   has continue-on-error: true, so its failure does not fail the run. Its steps are
#            untouched, so the failed step stays on record in the jobs API.
#   verdict  runs after deploy. It reads the deploy job's steps from the jobs API for this
#            run, and, only when this deploy failed, for the runs before it on main (newest
#            first). It fails the run only when the nearest earlier run that counts also
#            failed its deploy. It never reads a run's own conclusion, because a quiet
#            failure ends green and a run conclusion would hide it from the next run.
#
# What counts, for the deploy job of a run: any failed step (or a failed job) is a failure,
# so a failing wait step that leaves the deploy step skipped is still a failure. Otherwise a
# successful deploy-pages step is a good deploy, even if a newer push cancelled the run
# afterwards. Everything else (cancelled before the deploy ended, never started) is skipped:
# it does not break a streak and does not extend one. Concurrency is unchanged, so a
# cancelled run still releases the deployment lock. If a lookup call throws, or this run's
# own deploy job cannot be read as finished after about 30 seconds, the verdict job fails and
# sends the email, because a missed failure is worse than one extra email. An earlier run
# that cannot be read as good or bad is skipped, like a cancelled one.
# The names the verdict reads ("deploy" and "Run actions/deploy-pages@v4") are what GitHub
# records for a job and a step that have no name: line, so do not add one to either.
# The test is docs/tickets/5-deploy-email-two-fails/test_pages_two_fails.py.
#
# No Jekyll step on purpose. upload-pages-artifact serves the files exactly as pushed,
# which is what the reports need, and the repo has no Jekyll sources.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed deploy must not fail the run by itself. The verdict job below decides.
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Wait until the artifact shows up in the same lookup deploy-pages uses.
      - name: Wait for the artifact to be listed
        uses: actions/github-script@v9
        with:
          script: |
            const results = process.env.ACTIONS_RESULTS_URL;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!results || !token) {
              core.setFailed('ACTIONS_RESULTS_URL or ACTIONS_RUNTIME_TOKEN is missing in this step.');
              return;
            }
            // Backend IDs come from the token's "scp" claim, as in actions/toolkit
            // packages/artifact/src/internal/shared/util.ts getBackendIdsFromToken.
            let ids;
            try {
              const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
              for (const scope of String(claims.scp || '').split(' ')) {
                const parts = scope.split(':');
                if (parts[0] !== 'Actions.Results') continue;
                if (parts.length !== 3) throw new Error('unexpected Actions.Results scope');
                ids = { workflow_run_backend_id: parts[1], workflow_job_run_backend_id: parts[2] };
                break;
              }
            } catch (e) {
              core.setFailed('Could not read the backend IDs from the runtime token: ' + e.message);
              return;
            }
            if (!ids) {
              core.setFailed('The runtime token has no Actions.Results scope.');
              return;
            }
            // Same request the toolkit sends for listArtifacts() (JSON, proto field names).
            const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', results).href;
            const total = 20;
            let last = 'no response';
            for (let i = 1; i <= total; i++) {
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                  body: JSON.stringify(ids),
                  signal: AbortSignal.timeout(10000),
                });
                if (res.ok) {
                  const body = await res.json();
                  const found = (body.artifacts || []).filter(a => a.name === 'github-pages');
                  if (found.length >= 1) {
                    core.info('Artifact github-pages is listed (check ' + i + ').');
                    return;
                  }
                  last = 'artifact not listed yet';
                } else {
                  last = 'HTTP ' + res.status;
                }
              } catch (e) {
                last = e.message;
              }
              core.info('Check ' + i + ' of ' + total + ': ' + last + '.');
              if (i < total) await new Promise(r => setTimeout(r, 3000));
            }
            core.setFailed('Artifact github-pages was never listed by the results service after about 60 seconds (' + last + ').');
      - id: deployment
        uses: actions/deploy-pages@v4
  verdict:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail the run only when this deploy and the one before it both failed
        uses: actions/github-script@v9
        with:
          script: |
            // The names GitHub records for the deploy job and its deploy-pages step.
            const DEPLOY_JOB = 'deploy';
            const DEPLOY_STEP = 'Run actions/deploy-pages@v4';
            const LOOK_BACK = 30;
            const { owner, repo } = context.repo;
            const failed = c => c === 'failure' || c === 'timed_out';

            // bad: a step or the job failed. good: the deploy step finished well, even if
            // the run was cancelled afterwards. skip: cancelled or never started.
            function classify(jobs) {
              const job = jobs.find(j => j.name === DEPLOY_JOB);
              if (!job) return 'skip';
              const steps = job.steps || [];
              if (steps.some(s => failed(s.conclusion))) return 'bad';
              const deploy = steps.find(s => s.name === DEPLOY_STEP);
              if (deploy && deploy.conclusion === 'success') return 'good';
              if (failed(job.conclusion)) return 'bad';
              return 'skip';
            }
            async function jobsOf(runId) {
              const res = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: runId, per_page: 100,
              });
              return res.data.jobs;
            }

            // This run's own deploy job has finished when this job starts, but its record is
            // read over the API, so wait a little if it does not show as completed yet. If it
            // never does, the result is unknown and the run fails, so nothing is missed quietly.
            let now = null;
            for (let i = 1; i <= 10 && now === null; i++) {
              const job = (await jobsOf(context.runId)).find(j => j.name === DEPLOY_JOB);
              if (job && job.status === 'completed') {
                now = classify([job]);
              } else {
                core.info('The deploy job is not final yet (check ' + i + ' of 10).');
                if (i < 10) await new Promise(r => setTimeout(r, 3000));
              }
            }
            if (now === null) {
              core.setFailed('Could not read the finished deploy job of this run, so its result is unknown.');
              return;
            }
            core.info('This deploy: ' + now + '.');
            if (now !== 'bad') return;

            const res = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'pages.yml', branch: 'main', status: 'completed', per_page: LOOK_BACK,
            });
            const earlier = res.data.workflow_runs
              .filter(r => r.id < context.runId)
              .sort((a, b) => b.id - a.id);
            for (const run of earlier) {
              const before = classify(await jobsOf(run.id));
              core.info('Run ' + run.id + ': ' + before + '.');
              if (before === 'skip') continue;
              if (before === 'bad') {
                core.setFailed('The deploy failed in this run and in run ' + run.id + ', two in a row.');
              } else {
                core.info('The deploy before this one worked, so this failure stays quiet.');
              }
              return;
            }
            core.info('No earlier deploy result found, so this failure stays quiet.');
