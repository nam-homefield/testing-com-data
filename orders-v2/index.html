<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Testing.com Orders</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#00247a;--navy-soft:#edf2ff;--coral:#fd605b;--coral-soft:#ffeee9;--coral-ink:#c63d39;
--good:#1f8456;--good-soft:#e3f5ec;--bad:#c63d39;--bad-soft:#ffeee9;--ink:#2d2d2d;--ink-3:#6b7280;
--border:#e2e3e4;--surface:#fff;--bg:#f7f8fa}
body{font-family:'Work Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased;padding:28px 20px 64px;max-width:960px;margin:0 auto}
.topbar{background:var(--navy);color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.topbar p{font-size:13px;opacity:.8;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
border:1px solid rgba(255,255,255,.22);font-size:12px;padding:5px 11px;border-radius:999px;margin-top:12px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--coral)}
section{background:var(--surface);border:1px solid var(--border);border-radius:14px;
padding:22px 24px;margin-bottom:14px}
h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px}
.sub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.metric{background:var(--navy-soft);border:1px solid #d8e2ff;border-radius:10px;padding:14px 16px}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.metric .v{font-size:26px;font-weight:700;color:var(--navy);margin:4px 0;font-feature-settings:'tnum'}
.metric.hero{border-left:3px solid var(--coral)}
.metric.hero .v{font-size:30px}
/* up/down/flat kept as no-ops: the delta pill carries direction, the tile does not
   restate it in a second channel. */
.metric.up,.metric.down,.metric.flat{background:var(--navy-soft);border-color:#d8e2ff}
.metric.up .v,.metric.down .v,.metric.flat .v{color:var(--navy)}
.delta{display:inline-flex;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.down{color:var(--bad);background:var(--bad-soft)}
.delta.zero{color:var(--ink-3);background:#f0f1f2}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid #f0f1f2;vertical-align:top}
td.tm{color:var(--ink-3);white-space:nowrap;font-feature-settings:'tnum'}
td.amt{font-weight:700;color:var(--navy);white-space:nowrap;font-feature-settings:'tnum'}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.miss{background:var(--bad-soft);color:var(--bad)}
.flag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f0f1f2;color:var(--ink-3)}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.note a{color:var(--navy);font-weight:600}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.empty{font-size:13px;color:var(--ink-3);font-style:italic;padding:10px 0}
.spark{display:flex;gap:6px;align-items:flex-end;height:116px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;cursor:default}
.bar .fw{width:100%;flex:1;display:flex;align-items:flex-end;
border-bottom:1px solid var(--border)}
.bar .fill{width:100%;background:var(--navy);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.bar.today .fill{background:var(--coral)}
.bar span{font-size:11px;font-weight:700;color:var(--navy);margin-top:4px;font-feature-settings:'tnum'}
.bar label{font-size:10px;color:var(--ink-3)}
.bots{background:#eef6ff;border:1px solid #cfe3ff;border-left:3px solid var(--navy);
border-radius:8px;padding:13px 15px;font-size:12.5px;line-height:1.6;margin-bottom:10px}
.chartwrap{position:relative;height:300px;margin:4px 0 10px}
.chartwrap.tall{height:340px}
.vc{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.vc .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.vc .vh b{font-size:13.5px}
.vc .vd{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.vb{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.vb.early{background:#f0f1f2;color:var(--ink-3)}
.vb.flat{background:var(--navy-soft);color:var(--navy)}
.vb.good{background:var(--good-soft);color:var(--good)}
.vb.bad{background:var(--bad-soft);color:var(--bad)}
.cmp{margin:10px 0 8px;display:grid;gap:12px}
.cmpt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:4px}
.cmprow{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:5px}
.cmprow label{width:112px;color:var(--ink-3);flex:none}
.cmprow .track{flex:1;background:#f0f1f2;border-radius:3px;height:14px;overflow:hidden}
.cmprow .fill{height:100%;background:var(--ink-3);border-radius:3px}
.cmprow.after .fill{background:var(--navy)}
.cmprow .val{width:64px;text-align:right;font-weight:700;color:var(--navy);font-feature-settings:'tnum';flex:none}

.chartwrap.short{height:230px}

.ttv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy-soft);
border:1px solid #d8e2ff;border-radius:10px;padding:12px 15px;margin-bottom:16px;font-size:13px}
.ttp{border:1px solid var(--border);border-radius:11px;padding:15px 16px 10px;margin-bottom:12px}
.ttph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.ttph .ttn{font-size:13.5px;font-weight:700;color:var(--navy)}
.ttph .ttnow{font-size:20px;font-weight:700;font-feature-settings:'tnum'}
.ttph .ttvs{font-size:12px;color:var(--ink-3)}
.ttps{font-size:11.5px;color:var(--ink-3);margin-bottom:4px}
.chartwrap.tt{height:210px}
@media(max-width:600px){.chartwrap.tt{height:185px}}

.flag.launch{background:var(--bad-soft);color:var(--bad)}
.flag.funnel{background:#fff6e0;color:#9a7404}
.flag.content{background:#f0f1f2;color:var(--ink-3)}
code{font-size:11px;background:#f0f1f2;padding:1px 5px;border-radius:4px}
.warn{background:#fffbe8;border:1px solid #f2e2a8;border-left:3px solid #d9a406;
border-radius:8px;padding:13px 15px;font-size:12.5px;line-height:1.6;margin-bottom:18px}
table.attr{table-layout:fixed}
table.attr th:nth-child(1),table.attr td:nth-child(1){width:40%}
table.attr th:nth-child(2),table.attr td:nth-child(2){width:24%}
table.attr th:nth-child(3),table.attr td:nth-child(3){width:16%}
table.attr th:nth-child(4),table.attr td:nth-child(4){width:20%}
table.attr6{table-layout:fixed}
/* Six columns do not fit a phone, and this table is fixed-layout, so the cells keep
   their boxes while the TEXT runs straight across the neighbouring column. At 390px
   "10.79%" was printed through the word "normal". Nam reads this on a phone and mobile
   is about 70% of the site's traffic, so the narrow view drops the two raw counts and
   keeps the three that answer the question he asked it: what is the rate today, what is
   it usually, and is that a problem. The counts are still on the desktop view. */
table.attr6 td,table.attr6 th{overflow:hidden;text-overflow:ellipsis}
@media(max-width:620px){
  table.attr6 th:nth-child(2),table.attr6 td:nth-child(2),
  table.attr6 th:nth-child(3),table.attr6 td:nth-child(3){display:none}
  table.attr6 th:nth-child(1),table.attr6 td:nth-child(1){width:28%}
  table.attr6 th:nth-child(4),table.attr6 td:nth-child(4){width:24%}
  table.attr6 th:nth-child(5),table.attr6 td:nth-child(5){width:27%}
  table.attr6 th:nth-child(6),table.attr6 td:nth-child(6){width:21%}
  /* Three columns of numbers on a 390px screen need smaller type or "131.33%" gets
     clipped to "131.3...". The pricing page really does run above 100%, so the column
     has to fit six characters and a sign. */
  table.attr6 td,table.attr6 th{font-size:11px;padding-left:3px;padding-right:3px}
  table.attr6 .vb{font-size:10px;padding:2px 5px}
}
table.attr6 th:nth-child(1),table.attr6 td:nth-child(1){width:28%}
table.attr6 th:nth-child(2),table.attr6 td:nth-child(2){width:16%}
table.attr6 th:nth-child(3),table.attr6 td:nth-child(3){width:10%}
table.attr6 th:nth-child(4),table.attr6 td:nth-child(4){width:17%}
table.attr6 th:nth-child(5),table.attr6 td:nth-child(5){width:13%}
table.attr6 th:nth-child(6),table.attr6 td:nth-child(6){width:16%}
table.attr2{table-layout:fixed}
table.attr2 th:nth-child(1),table.attr2 td:nth-child(1){width:46%}
table.attr2 th:nth-child(2),table.attr2 td:nth-child(2){width:16%}
table.attr2 th:nth-child(3),table.attr2 td:nth-child(3){width:14%}
table.attr2 th:nth-child(4),table.attr2 td:nth-child(4){width:24%}
table.labs{table-layout:fixed}
table.labs th:nth-child(1),table.labs td:nth-child(1){width:40%}
table.labs th:nth-child(2),table.labs td:nth-child(2){width:28%}
table.labs th:nth-child(3),table.labs td:nth-child(3){width:32%}
h3.mini{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;
letter-spacing:.04em;margin:18px 0 6px}
tr.hot td{background:var(--good-soft)}
tr.hot td:first-child{font-weight:600}
.qa{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;
font-size:12px;color:var(--ink-3);line-height:1.6}
.stale{display:none;background:var(--coral);color:#fff;border-radius:12px;padding:13px 18px;
margin-bottom:14px;font-size:13.5px;font-weight:600;line-height:1.5}
footer{font-size:11px;color:var(--ink-3);text-align:center;margin-top:22px;line-height:1.7}
@media(max-width:560px){body{padding:16px 12px 48px}.metric .v{font-size:22px}td,th{padding:8px 6px}}
/* A four-column table cannot hold a product name like "Lipid/Cholesterol Panel +
   Comprehensive Liver Function Panel + Complete Blood Count (CBC) with
   Differential" at phone width. Rows become cards, each cell labelled by its
   column, which is the standard fallback and keeps every value readable. */
@media(max-width:600px){
  table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.stack tr{display:block;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;background:var(--surface)}
  table.stack td{display:flex;justify-content:space-between;gap:14px;border:0;
    padding:4px 0;text-align:right}
  table.stack td::before{content:attr(data-label);color:var(--ink-3);font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:left;
    flex:0 0 auto;padding-top:2px}
  table.stack td[data-label="What they bought"]{flex-direction:column;text-align:left}
  table.stack td[data-label="What they bought"]::before{margin-bottom:2px}
}
#load{padding:40px 4px;font-size:14px;color:var(--ink-3)}
#err{display:none;background:var(--coral-soft);border:1px solid #ffd8d0;border-left:3px solid var(--coral);
border-radius:10px;padding:16px 18px;font-size:13.5px;line-height:1.6;color:var(--coral-ink)}

/span></div><div class=\"ttps\">the /tests/ pages with a cart button, plus the eight /std-testing/ product pages (herpes, HIV, panels). Usual swing on a Tuesday is \u00b122%.</div><div class=\"chartwrap tt\"><canvas id=\"tt_monetized_chart\"></canvas></div></div><div class=\"ttp\"><div class=\"ttph\"><span class=\"ttn\">Everything else</span><span class=\"ttnow\">2,397</span><span class=\"delta zero\">+2%</span><span class=\"ttvs\">vs 2,341 on a normal Tuesday</span></div><div class=\"ttps\">the whole rest of the site. Usual swing on a Tuesday is \u00b118%.</div><div class=\"chartwrap tt\"><canvas id=\"tt_other_chart\"></canvas></div></div><p class=\"note\">Every US visit is counted, from every channel, the same way today and on the earlier days. Engaged visits are not used, because Analytics finishes judging which visits were engaged about a day late, so a normal morning looked like a collapse. An hour running above twice its normal (the middle value of that hour on the earlier Tuesdays, and at least 100 visits over it) is counted at the normal level, so a crawler burst cannot read as a rise. 1 hour on the earlier Tuesdays ran above twice the normal level, which is how a crawler burst looks, so it was counted at the normal level. The cut-off is 09:59 because Analytics keeps adding to recent hours for a while: There is no recent enough earlier reading to compare this one against, so the cut-off sits a fixed 4 hours behind the clock. Comparing a part-day against finished days would show a fake collapse every morning, so only the same hours are counted on both sides.</p></section>", "traffic": {"ready": true, "charts": {"tt_std_geo_chart": {"labels": ["12am", "1am", "2am", "3am", "4am", "5am", "6am", "7am", "8am", "9am"], "today": [27, 51, 65, 77, 83, 91, 101, 114, 121, 142], "base": [25, 46, 64, 78, 86, 99, 115, 144, 176, 213], "day": "Tuesday"}, "tt_monetized_chart": {"labels": ["12am", "1am", "2am", "3am", "4am", "5am", "6am", "7am", "8am", "9am"], "today": [30, 61         }
        g.save();
        // Lighter, and label-free. A half-tracked day still has real data in it, so it
        // keeps its point on the line, but it sits at the top of a cliff the reader's
        // eye reads as a fall. Tinting it says "this is already the outage" without
        // claiming the day is empty.
        span(I.murky, .08);
        var box = span(I.dark, .16);
        if (box) {
          g.font = FONT; g.fillStyle = '#6b7280';
          var lbl = 'tracking down';
          if (g.measureText(lbl).width + 10 < box[1] - box[0])
            g.fillText(lbl, (box[0] + box[1]) / 2 - g.measureText(lbl).width / 2, b - 8);
        }
        g.restore();
      }};
      var mark = {id:'chg', afterDatasetsDraw:function(c){
        var g = c.ctx, xs = c.scales.x, t = c.chartArea.top, b = c.chartArea.bottom;
        I.marks.forEach(function(m, k){
          var i = I.dates.indexOf(m.date);
          if (i < 0) return;
          var px = xs.getPixelForValue(i), col = COL[m.type] || '#6b7280';
          g.save(); g.beginPath(); g.setLineDash([5,4]); g.lineWidth = 1.5;
          g.strokeStyle = col; g.moveTo(px, t); g.lineTo(px, b); g.stroke();
          g.setLineDash([]);
          g.font = FONT;
          var w = g.measureText(m.label).width, x = px + 4, y = t + 4 + (k % 2) * 15;
          if (x + w + 6 > c.chartArea.right) x = px - w - 6;
          tag(g, m.label, x, y, col);
          g.restore();
        });
      }};
      // One chart per denominator population, never one chart with both. Section rates
      // count sessions that LANDED in a section; page rates count sessions that VIEWED
      // a page. Sharing an axis would flatten the section lines under the page line and
      // invite a comparison between two different groups of people.
      // band=false for the checkout chart. That chart is the one still recording
      // during an outage, so shading it grey and stamping "tracking down" across it
      // would say the opposite of what it is there to show.
      function impactChart(id, series, ymax, ytitle, unit, band){
        var el = document.getElementById(id);
        if (!el || !series || !series.length) return;
        mk(el.getContext('2d'), {type:'line',
          data:{labels:I.labels, datasets:series.map(function(sv){
            return {label:sv.label, data:sv.rate, borderColor:sv.color,
                    backgroundColor:sv.color, borderWidth:sv.dashed ? 1.8 : 2.5,
                    borderDash:sv.dashed ? [5,4] : [], fill:false, tension:.25,
                    pointRadius:sv.dashed ? 0 : 3, pointHoverRadius:6};
          })},
          options:{responsive:true, maintainAspectRatio:false,
            interaction:{mode:'index', intersect:false}, layout:{padding:{top:28}},
            scales:{
              y:{beginAtZero:true, suggestedMax:ymax, title:{display:true,
                 text:ytitle, font:{size:10}},
                 grid:{color:'#f0f1f2'}, ticks:{font:{size:10}, color:'#6b7280',
                 callback:function(v){ return v + (unit || ''); }}},
              x:{grid:{display:false}, ticks:{font:{size:10}, color:'#6b7280',
                 maxRotation:0, autoSkipPadding:8}}},
            plugins:{legend:{position:'bottom', labels:{boxWidth:14, boxHeight:2,
                     font:{size:11}, usePointStyle:false}},
              tooltip:{callbacks:{afterBody:function(it){
                var i = it[0].dataIndex, out = [];
                series.forEach(function(sv){
                  out.push(sv.label.replace(' cart rate','') + ': ' + sv.carts[i]
                           + ' ' + (sv.numword || 'carts') + ' / '
                           + sv.visits[i].toLocaleString()
                           + ' ' + (sv.denword || 'visits'));
                });
                // Whole site, always. Orders come from Stripe invoices and carry no
                // page attribution; they are joined to the chart on date alone. Printed
                // bare as "Paid orders" under a page-scoped header it read as orders
                // FROM that page, which is a number this pipeline does not have.
                out.push('Paid orders, whole site: ' + I.orders[i]);
                // band === false is the checkout chart, which kept recording. Telling
                // its reader "tracking was down" would contradict its own caption.
                if (band !== false) {
                  if (I.dark && I.dark.indexOf(I.dates[i]) >= 0)
                    out.push('Cart tracking was down. This day recorded no carts, '
                             + 'it did not have none.');
                  else if (I.murky && I.murky.indexOf(I.dates[i]) >= 0)
                    out.push('Tracking broke partway through this day, so this is '
                             + 'an undercount, not a fall.');
                }
                if (I.partial && i === I.labels.length - 1)
                  out.push('Partial day, still counting');
                I.marks.filter(function(m){ return m.date === I.dates[i]; })
                       .forEach(function(m){ out.push('CHANGE: ' + m.label); });
                return out;
              }}}}},
          plugins:(band === false ? [mark] : [darkband, mark])});
      }
      impactChart('chg_chart', I.series, I.ymax, 'Carts per 1,000 visits', '');
      impactChart('chg_page_chart', I.page_series, I.page_ymax,
                  I.page_ytitle, I.page_unit);
    }
  }
  // The banner is recomputed on a timer rather than once at load. This page is read
  // by leaving it open on a monitor, so a pipeline that dies at 11am has to become
  // visible to someone who opened the tab at 9. Computing it once did the opposite:
  // the tab that had been open longest was the one least likely to warn anybody.
  function setStale(builtMs){
    var el = document.getElementById('stale');
    if (!el) return;
    // 70 minutes: tolerates one missed or slow run on a 30 minute cadence, and
    // still surfaces a dead pipeline inside the hour.
    var mins = Math.floor((Date.now() - builtMs)/60000);
    if (mins > 70) {
      el.textContent = 'These numbers are ' + Math.floor(mins/60) + 'h ' + (mins%60)
        + 'm old, so the refresh has missed at least one run. Tell Nam.';
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  }

  function render(d){
      var m = d.metrics.map(function(x){
        return '<div class="metric' + (x.hero ? ' hero' : '')
             + (x.tone ? ' ' + x.tone : '') + '"><div class="k">' + x.k
             + '</div><div class="v">' + x.v + '</div>' + x.sub + '</div>';
      }).join('');
      app.innerHTML =
        '<div class="topbar"><h1>Testing.com Orders</h1>'
        + '<p>Customer orders and revenue. Internal test orders are excluded.</p>'
        + '<span class="pill"><span class="dot"></span>Updated ' + d.built_label
        + ' PT &middot; refreshes every 30 minutes</span></div>'
        + (d.notice_html || '')
        + '<section><h2>Today</h2><div class="sub">' + d.day_label
        + ' &middot; all times Pacific</div><div class="metrics">' + m + '</div></section>'
        + '<section><h2>Orders today</h2><div class="sub">Every customer order, newest first</div>'
        + '<table class="stack"><thead><tr><th>Time</th><th>Amount</th><th>What they bought</th><th>Status</th>'
        + '</tr></thead><tbody>' + d.rows_html + '</tbody></table></section>'
        + '<section><h2>Orders per day</h2><div class="sub">Paid customer orders, last '
        + d.mix_days + ' days including today</div>'
        + '<div class="spark">' + d.spark_html + '</div></section>'
        + '<section><h2>What people are buying</h2><div class="sub">Paid customer orders, last '
        + d.mix_days + ' days</div><table><thead><tr><th>Product</th><th>Orders</th></tr></thead>'
        + '<tbody>' + d.mix_html + '</tbody></table>'
        + (d.lab_html || '') + '</section>'
        + (d.pace_html || '') + (d.traffic_html || '')
        + d.attribution_html
        + '<footer>Generated ' + d.built_label + ' Pacific &middot; refreshes every 30 minutes<br>'
        + 'Questions: Nam Phan</footer>';
      drawCharts(d);
  }

  function load(){
    return Promise.resolve({ok:true, json:function(){ return window.__STAGING__; }})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        if (d.shell_version && d.shell_version !== SV) {
          var u = new URL(location.href);
          if (u.searchParams.get('sv') !== d.shell_version) {
            u.searchParams.set('sv', d.shell_version);
            location.replace(u.toString());
            return;
          }
          fail('<b>Your browser is holding an old copy of this page.</b> The report itself '
             + 'is fine. Hard refresh to update it: Cmd+Shift+R on a Mac, Ctrl+Shift+R on '
             + 'Windows.');
          return;
        }
        // Re-render only when the numbers actually changed. Most polls land between
        // builds, and repainting the DOM under a reader who is mid-scroll or reading a
        // tooltip for no gain is worse than doing nothing.
        if (d.built_ms !== lastBuilt) { lastBuilt = d.built_ms; render(d); }
        setStale(lastBuilt);
        everLoaded = true;
      })
      .catch(function(e){
        // A failed poll must never blank a page that is already showing good numbers.
        // Once something is on screen, the staleness banner is what tells the reader
        // those numbers have aged, and it keeps working with the network down.
        if (everLoaded) return;
        fail('<b>Could not load current numbers.</b> The report data could not be fetched ('
           + e.message + '). This usually means the refresh job has not run yet or GitHub is '
           + 'unreachable. Reload in a minute; if it persists, tell Nam.');
      });
  }

  load();
  // Poll well inside the 30 minute build cadence, so an open tab is never more than a
  // couple of minutes behind the pipeline. The payload is a few KB of JSON served by
  // Pages, so the cost of being wrong about the interval is negligible.
  /* staging: no polling */
  // The banner ages on its own clock: with the network down, no poll ever resolves,
  // and that is exactly when a reader most needs to be told the numbers are old.
  setInterval(function(){ if (lastBuilt) setStale(lastBuilt); }, 60000);
  // Coming back to a backgrounded tab should show current numbers immediately rather
  // than up to 90 seconds later. Browsers also throttle timers in hidden tabs.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) load();
  });
})();
</script>
</body></html>
